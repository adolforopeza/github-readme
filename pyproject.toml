# pyproject.toml
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "github-stats-optimizer"
version = "0.1.0"
description = "Backend modular para generación dinámica de READMEs y dashboards"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
include = ["core*", "api*"]